let order = [];
let current = 0;
let score = 0;

function shuffle(arr) {
  for (let i = arr.length -1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function startQuiz() {
  order = shuffle([...Array(questions.length).keys()]);
  current = 0;
  score = 0;
  document.getElementById('final').textContent = '';
  document.getElementById('restart').style.display = 'none';
  document.getElementById('next').style.display = 'none';
  showQuestion();
}

function showQuestion() {
  if (current >= order.length) {
    endQuiz();
    return;
  }
  const q = questions[order[current]];
  document.getElementById('progress').textContent = `Question ${current+1} / ${order.length}`;
  document.getElementById('barFill').style.width = `${(current/order.length)*100}%`;
  document.getElementById('word').textContent = q.word;
  document.getElementById('score').textContent = `Score: ${score}`;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  const opts = [...q.options];
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(btn, opt, q.answer);
    optsDiv.appendChild(btn);
  });
  document.getElementById('next').style.display = 'none';
}

function selectAnswer(btn, chosen, correctAns) {
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(b => b.onclick = null);
  buttons.forEach(b => {
    if (b.textContent === correctAns) b.classList.add('correct');
    else if (b === btn) b.classList.add('wrong');
  });
  if (chosen === correctAns) score++;
  document.getElementById('score').textContent = `Score: ${score}`;
  document.getElementById('next').style.display = 'inline-block';
}

function nextQuestion() {
  current++;
  showQuestion();
}

function endQuiz() {
  document.getElementById('progress').textContent = 'Quiz Complete!';
  document.getElementById('barFill').style.width = '100%';
  document.getElementById('word').textContent = '🎉';
  document.getElementById('options').innerHTML = '';
  document.getElementById('score').textContent = '';
  document.getElementById('final').textContent = `Final Score: ${score} / ${order.length} (${Math.round(score/order.length*100)}%)`;
  document.getElementById('restart').style.display = 'inline-block';
  document.getElementById('next').style.display = 'none';
}

startQuiz();
