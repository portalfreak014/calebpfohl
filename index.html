<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            overflow-x: hidden; /* Prevent horizontal scrollbar */
            padding: 0 20px; /* Added padding to the left and right of the entire site */
            max-width: 500px; /* Restrict page width on desktop */
            margin: 0 auto; /* Center the content */
        }

        header {
            position: relative;
            padding: 20px;
            text-align: center;
            color: #fff;
            padding-top: 60px; /* Added padding to create space for the logo */
        }

        nav {
            position: fixed;
            top: 0;
            right: -100%; /* Initial position off the screen */
            height: 100%;
            width: 100%;
            background-color: #333;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1; /* Ensure menu appears above other elements */
            transition: right 0.3s ease-in-out; /* Smooth transition for the right property */
            text-align: center; /* Center align the items in the nav menu */
        }

        nav a {
            color: #fff;
            text-decoration: none;
            padding: 10px;
            margin: 10px 0;
            display: block;
        }

        .social-icons {
            display: flex;
            justify-content: center; /* Center align the social icons */
            margin-top: 20px; /* Added margin to bring it up */
        }

        .social-icons a {
            display: inline-block;
            margin: 0 10px; /* Adjusted margin for more spacing */
        }

        .social-icons img {
            width: 24px; /* Adjusted width for smaller icons */
            height: 24px; /* Adjusted height for smaller icons */
        }

        .hamburger-container {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            z-index: 2; /* Ensure hamburger icon appears above other elements */
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding-right: 20px; /* Added padding to the right for the hamburger icon */
        }

        .hamburger-icon {
            width: 30px; /* Adjust as needed */
            height: 3px;
            background-color: #444; /* Dark gray for initial state */
            margin: 10px 0; /* Increased margin for more space between lines */
            transition: transform 0.3s ease-in-out, background-color 0.3s ease-in-out; /* Smooth transition for transform and background-color properties */
        }

        /* Pseudo-elements to create additional lines for the "X" effect */
        .hamburger-icon::before,
        .hamburger-icon::after {
            content: '';
            display: block;
            width: 30px;
            height: 3px;
            background-color: #444; /* Dark gray for initial state */
            position: absolute;
            transition: transform 0.3s ease-in-out; /* Smooth transition for the transform property */
        }

        .hamburger-icon::before {
            transform: translateY(-10px); /* Positioning for the top line of the "X" */
        }

        .hamburger-icon::after {
            transform: translateY(10px); /* Positioning for the bottom line of the "X" */
        }

        .hamburger-icon.active {
            background-color: #fff; /* White color when active */
            transform: rotate(-45deg); /* Rotate the central line of the "X" */
        }

        .hamburger-icon.active::before,
        .hamburger-icon.active::after {
            background-color: #fff; /* White color when active */
            transform: rotate(90deg); /* Rotate pseudo-elements to complete the "X" */
        }

        /* Mobile Styles */
        @media only screen and (max-width: 600px) {
            header, section {
                padding: 10px;
            }

            .hamburger-container {
                top: 20px;
                right: 20px;
                padding-right: 10px; /* Adjusted padding for mobile */
            }

            .social-icons img {
                width: 20px; /* Adjusted width for smaller icons on mobile */
                height: 20px; /* Adjusted height for smaller icons on mobile */
            }
        }
    </style>
</head>
<body>
