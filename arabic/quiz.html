<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6750A4">
  <meta name="description" content="A glossary-based Arabic study quiz.">
  <title>Arabic Study Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#6750a4;--on-primary:#fff;--primary-container:#e9ddff;--on-primary-container:#21005d;--surface:#fffbfe;--surface-low:#f7f2fa;--surface-high:#ece6f0;--on-surface:#1c1b1f;--variant:#49454f;--outline-variant:#cac4d0;--success:#146c2e;--success-container:#b9f8c8;--error:#ba1a1a;--error-container:#ffdad6;--known:#146c2e;--known-container:#b9f8c8;--radius-md:18px}
    *{box-sizing:border-box}html,body{min-width:320px;min-height:100%}body{margin:0;color:var(--on-surface);background:var(--surface);font-family:"Noto Sans","Noto Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer}.material-symbols-rounded{font-family:"Material Symbols Rounded";font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24}
    .app{width:min(100%,760px);min-height:100dvh;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.topbar{display:grid;grid-template-columns:48px 1fr 48px 48px;align-items:center;min-height:56px;gap:8px}.icon-button{display:grid;place-items:center;width:48px;height:48px;padding:0;border:0;border-radius:50%;color:var(--variant);background:transparent}.icon-button:hover{background:rgb(29 27 32 / .08)}.heading{min-width:0;text-align:center}.eyebrow{margin:0;color:var(--variant);font-size:.78rem;font-weight:700;letter-spacing:.04em}.title{overflow:hidden;margin:2px 0 0;font-size:1rem;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
    .progress-block{margin:16px 4px 0}.progress-copy{display:flex;justify-content:space-between;gap:12px;margin:0 0 8px;color:var(--variant);font-size:.83rem;font-weight:700}.progress{height:8px;overflow:hidden;border-radius:999px;background:var(--surface-high)}.progress>span{display:block;width:0;height:100%;border-radius:inherit;background:var(--primary);transition:width 220ms ease}.additional-toggle{display:inline-flex;align-items:center;gap:8px;margin:10px 4px 0;color:var(--variant);font-size:.82rem;font-weight:700}.additional-toggle input{width:18px;height:18px;margin:0;accent-color:var(--primary)}.review-all-link{display:inline-flex;align-items:center;gap:4px;margin:8px 4px 0;padding:0;border:0;background:transparent;color:var(--primary);font-size:.78rem;font-weight:700;text-decoration:underline;text-decoration-color:transparent}.review-all-link:hover{text-decoration-color:var(--primary)}.review-all-link .material-symbols-rounded{font-size:16px}
    main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:14px 0 8px}#quiz-screen{min-height:0;display:flex;flex:1;flex-direction:column}#quiz-screen.hidden{display:none}.question-kicker-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}.question-kicker{margin:0;color:var(--variant);font-size:.9rem;font-weight:700}.question-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}.flag-button,.audio-button{display:grid;place-items:center;width:36px;height:36px;padding:0;border-radius:12px;background:var(--surface)}.flag-button{border:0;border-radius:50%;color:var(--variant)}.audio-button{border:1px solid var(--outline-variant);color:var(--primary)}.audio-button[aria-disabled="true"]{color:var(--variant);cursor:default}.known-toggle{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:2px solid var(--outline-variant);border-radius:999px;color:var(--variant);background:var(--surface);font-size:.78rem;font-weight:700;white-space:nowrap}.known-toggle .material-symbols-rounded{font-size:18px}.known-toggle.is-known{border-color:var(--known);color:var(--known);background:var(--known-container)}.known-toggle:disabled{opacity:.7;cursor:default}
    .prompt{margin:0 0 14px;font-family:"Noto Sans Arabic","Noto Sans",sans-serif;font-size:clamp(2rem,7vw,3.25rem);font-weight:700;line-height:1.2;text-align:center}.prompt.prompt-en{font-family:"Noto Sans",sans-serif;font-size:clamp(1.5rem,6vw,2.5rem)}.choices{display:grid;gap:8px}.choice{display:grid;grid-template-columns:32px minmax(0,1fr);align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;border:2px solid var(--outline-variant);border-radius:var(--radius-md);color:var(--on-surface);background:var(--surface);text-align:left}.choice:hover:not(:disabled){background:var(--surface-low)}.choice-key{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--variant);background:var(--surface-high);font-size:.82rem;font-weight:800}.choice-text{font-size:1rem;font-weight:650;line-height:1.35}.choice-text-ar{font-family:"Noto Sans Arabic",sans-serif;font-size:1.15rem}.choice.selected{border-color:var(--primary);background:var(--primary-container)}.choice.correct{border-color:var(--success);color:#083d19;background:var(--success-container)}.choice.incorrect{border-color:var(--error);color:#601410;background:var(--error-container)}.choice:disabled{cursor:default}
    .feedback{display:none;align-items:flex-start;gap:10px;margin-top:10px;padding:12px 14px;border-radius:var(--radius-md);line-height:1.35}.feedback.show{display:flex}.feedback.good{color:#083d19;background:var(--success-container)}.feedback.bad{color:#601410;background:var(--error-container)}.feedback strong{display:block;margin-bottom:2px}.feedback-ar{font-family:"Noto Sans Arabic",sans-serif}.action-area{margin-top:auto;min-height:60px;padding-top:10px;flex-shrink:0}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border:0;border-radius:999px;font-weight:800;text-decoration:none}.button.full{width:100%}.button.primary{color:var(--on-primary);background:var(--primary);box-shadow:0 1px 3px rgb(0 0 0 / .25)}.button.primary:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}.button.tonal{color:var(--on-primary-container);background:var(--primary-container)}
    .screen{text-align:center}.screen-icon{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 20px;border-radius:24px;color:var(--on-primary-container);background:var(--primary-container)}.screen-icon .material-symbols-rounded{font-size:38px;font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 36}.screen h1{margin:0 0 10px;font-size:clamp(1.8rem,7vw,2.5rem);line-height:1.15;letter-spacing:-.03em}.screen p{max-width:42ch;margin:0 auto 24px;color:var(--variant);line-height:1.55}.score{margin:24px 0;color:var(--primary);font-size:3.2rem;font-weight:800;line-height:1}.screen .button+.button{margin-top:12px}.snackbar{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));z-index:10;max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;color:#fff;background:#323036;box-shadow:0 4px 14px rgb(0 0 0 / .24);font-size:.9rem;font-weight:700;opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:opacity 180ms ease,transform 180ms ease}.snackbar.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
    .written-answer{display:grid;gap:10px}.written-answer input{width:100%;min-height:62px;padding:10px 16px;border:2px solid var(--outline-variant);border-radius:var(--radius-md);color:var(--on-surface);background:var(--surface);font-family:"Noto Sans Arabic","Noto Sans",sans-serif;font-size:clamp(1.4rem,6vw,2rem);font-weight:700;line-height:1.4;text-align:center;direction:rtl}.written-answer input:focus{border-color:var(--primary);outline:0}.written-answer input:disabled{color:var(--variant);background:var(--surface-low)}.written-answer-help{margin:0;color:var(--variant);font-size:.86rem;line-height:1.45;text-align:center}
    @media (min-width:700px){.app{padding:20px 32px}main{padding:18px 0 10px}.choice{min-height:58px;padding:12px 18px}}@media (max-height:720px){.app{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom))}.topbar{min-height:48px}.icon-button{width:44px;height:44px}.progress-block{margin-top:8px}.question-kicker-row{margin-bottom:8px}.prompt{margin-bottom:10px;font-size:clamp(1.85rem,7vw,2.75rem)}.choices{gap:7px}.choice{min-height:48px;padding:8px 12px}.feedback{margin-top:8px;padding:10px 12px}.action-area{min-height:56px;padding-top:8px}.button{min-height:48px}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>

      <button class="icon-button" id="restart-button" type="button" aria-label="Restart chapter"><span class="material-symbols-rounded" aria-hidden="true">refresh</span></button>
    </header>
    <section class="progress-block" id="progress-block" aria-label="Quiz progress">
