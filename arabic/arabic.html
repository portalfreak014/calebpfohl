<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6750a4"><title>Arabic Study</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--p:#6750a4;--pc:#e9ddff;--opc:#21005d;--s:#fffbfe;--sl:#f7f2fa;--sh:#ece6f0;--ink:#1c1b1f;--v:#49454f;--o:#79747e;--ov:#cac4d0;--r:20px}*{box-sizing:border-box}body{margin:0;background:var(--s);color:var(--ink);font-family:"Noto Sans","Noto Sans Arabic",sans-serif}.app{width:min(100%,760px);margin:auto;padding:16px 16px 96px}.top{display:flex;align-items:center;justify-content:space-between;min-height:56px}.brand{display:flex;gap:10px;align-items:center}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--pc);color:var(--opc);font:800 1.3rem "Noto Sans Arabic"}.brand p{margin:0;font-size:.78rem;color:var(--v)}.brand b{font-size:1rem}.icon{display:grid;place-items:center;width:46px;height:46px;border:0;border-radius:50%;background:transparent;color:var(--v)}.hero{margin-top:16px;padding:24px;border-radius:28px;background:var(--pc);color:var(--opc)}.eyebrow{margin:0 0 9px;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.hero h1{max-width:13ch;margin:0 0 11px;font-size:clamp(2rem,8vw,2.8rem);line-height:1.1;letter-spacing:-.04em}.hero p{margin:0;line-height:1.55}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;margin-top:20px;padding:0 20px;border-radius:999px;background:var(--p);color:#fff;text-decoration:none;font-weight:800}.section{margin-top:34px}.heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:13px}.heading h2{margin:0;font-size:1.3rem}.hint{margin:0;color:var(--v);font-size:.82rem}.mode{display:flex;gap:0;width:max-content;border:1px solid var(--ov);border-radius:999px;padding:3px;background:var(--sl)}.mode button{border:0;border-radius:999px;padding:9px 12px;background:transparent;color:var(--v);font:700 .8rem inherit}.mode button.active{background:var(--pc);color:var(--opc)}.units{display:grid;gap:12px}.unit{border:1px solid var(--ov);border-radius:var(--r);background:var(--s);overflow:hidden}.unit summary{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;min-height:78px;padding:14px;cursor:pointer;list-style:none}.unit summary::-webkit-details-marker{display:none}.unit[open] summary{background:var(--sl)}.uicon{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--pc);color:var(--opc);font-weight:800}.utitle{display:block;font-weight:800}.umeta{display:block;margin-top:3px;color:var(--v);font-size:.82rem}.chev{color:var(--v);transition:transform .2s}.unit[open] .chev{transform:rotate(180deg)}.soon .uicon{background:var(--sh);color:var(--v)}.pill{padding:4px 9px;border-radius:999px;background:var(--sh);color:var(--v);font-size:.66rem;font-weight:800;text-transform:uppercase}.chapters{display:grid;gap:8px;padding:0 14px 14px}.chapter{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:11px;min-height:64px;padding:10px;border-radius:15px;background:var(--sl);color:inherit;text-decoration:none}.chapter:hover{background:var(--sh)}.num{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--pc);color:var(--opc);font-weight:800;font-size:.83rem}.ctitle{font-weight:700}.cmeta{display:block;color:var(--v);font-size:.77rem;margin-top:2px}.status{font-size:.7rem;color:var(--p);font-weight:800}.soon .chapters{opacity:.62}.soon .chapter{background:var(--sl)}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:8px 12px;background:#fffbfef2;border-top:1px solid var(--ov);backdrop-filter:blur(12px)}.navin{display:grid;grid-template-columns:repeat(4,1fr);width:min(100%,600px)}.nav a,.nav button{display:grid;place-items:center;gap:2px;min-height:55px;border:0;background:transparent;color:var(--v);font:700 .7rem inherit;text-decoration:none}.nav .active{color:var(--opc)}.material-symbols-rounded{font-family:"Material Symbols Rounded";font-size:23px}@media(min-width:700px){.app{padding:28px 32px 96px}.hero{padding:38px}.chapters{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="app"><header class="top"><div class="brand"><div class="mark" lang="ar">ع</div><div><b>Arabic Study</b><p lang="ar" dir="rtl">تعلّم العربية خطوة بخطوة</p></div></div><button class="icon" aria-label="Menu"><span class="material-symbols-rounded">menu</span></button></header><section class="hero"><p class="eyebrow">Your study space</p><h1>Learn Arabic with focus.</h1><p>Choose a unit, then work through a chapter at a time.</p><a class="button" id="start" href="quiz.html?unit=unit6&chapter=ch26">Start studying <span class="material-symbols-rounded">arrow_forward</span></a></section><section class="section"><div class="heading"><h2>Study direction</h2></div><p class="hint">Applies to every available chapter.</p><div class="mode"><button id="ar" class="active">ع to English</button><button id="en">English to ع</button></div></section><section class="section"><div class="heading"><h2>Units</h2><p class="hint">10 course units</p></div><div class="units" id="units"></div></section></main><nav class="nav"><div class="navin"><button class="active"><span class="material-symbols-rounded">home</span>Home</button><a href="match.html"><span class="material-symbols-rounded">extension</span>Match</a><a href="roots.html"><span class="material-symbols-rounded">account_tree</span>Roots</a><button><span class="material-symbols-rounded">bar_chart</span>Progress</button></div></nav><script src="data/units-manifest.js"></script><script>let mode=localStorage.getItem('arabicStudy.quizDirection')==='en-to-ar'?'en-to-ar':'ar-to-en';const units=document.querySelector('#units');function url(u,c){return`quiz.html?unit=${u}&chapter=${c}${mode==='en-to-ar'?'&mode=en-to-ar':''}`}function render(){document.querySelector('#ar').classList.toggle('active',mode==='ar-to-en');document.querySelector('#en').classList.toggle('active',mode==='en-to-ar');let ids=window.UnitsManifest.listUnits();units.innerHTML=ids.map(id=>{let u=window.UnitsManifest.getUnit(id),active=u.chapters.some(c=>c.available),num=id.replace('unit',''),open=active?' open':'',cards=u.chapters.map(c=>c.available?`<a class="chapter" href="${url(id,c.id)}"><span class="num">${c.number}</span><span><span class="ctitle">${c.title}</span><span class="cmeta">Vocabulary quiz</span></span><span class="status">Start</span></a>`:`<div class="chapter" aria-disabled="true"><span class="num">${c.number}</span><span><span class="ctitle">${c.title}</span><span class="cmeta">Coming soon</span></span><span class="pill">Soon</span></div>`).join('');return`<details class="unit ${active?'':'soon'}"${open}><summary><span class="uicon">${num}</span><span><span class="utitle">${u.title}</span><span class="umeta">${active?u.chapters.filter(c=>c.available).length+' chapters available':'Coming soon'}</span></span>${active?'<span class="material-symbols-rounded chev">expand_more</span>':'<span class="pill">Soon</span>'}</summary><div class="chapters">${cards}</div></details>`}).join('')}document.querySelector('#ar').onclick=()=>{mode='ar-to-en';localStorage.setItem('arabicStudy.quizDirection',mode);render()};document.querySelector('#en').onclick=()=>{mode='en-to-ar';localStorage.setItem('arabicStudy.quizDirection',mode);render()};render()</script></body></html>
