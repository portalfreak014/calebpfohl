<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chaos Mode — Fursa</title><link rel="stylesheet" href="chaos.css"></head><body>
<div id="scenery" aria-hidden="true"></div><main>
<header><a href="arabic.html">Exit to Fursa</a><strong>CHAOS MODE</strong><button id="mute" type="button" aria-pressed="false">Mute music</button></header>
<section id="setup"><h1 id="setup-title" tabindex="-1">Choose a unit</h1><div id="units" class="number-grid" role="group" aria-label="Units"></div><div id="chapter-panel" hidden><button id="back" type="button">All units</button><h2 id="chapter-title">Choose a chapter</h2><div id="chapters" class="number-grid chapter-grid" role="group" aria-label="Chapters"></div></div><p id="load" role="status"></p></section>
<aside id="controls"><label class="volume-control" for="volume">Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.25"><output id="volume-value" for="volume">25%</output></label><label><input id="reduced" type="checkbox"> Reduce effects</label></aside>
<section id="count" hidden><h1 id="count-text" tabindex="-1">3</h1></section>
<section id="game" hidden><div class="round-top"><p id="score"></p><div id="clock" role="timer" aria-label="Seconds remaining" aria-live="off">5.000</div></div><h1 id="prompt" tabindex="-1"></h1><div id="answers"></div><p id="feedback" role="status" tabindex="-1"></p></section>
<section id="results" hidden><h1 id="results-title" tabindex="-1">Round complete</h1><p id="summary"></p><ul id="misses"></ul><button id="retry">Review missed words</button><button id="again">Choose a unit</button></section>
<p id="audio-status" role="status"></p><button id="audio-retry" type="button" hidden>Play music</button>
</main><div id="reactions" aria-hidden="true"></div><script src="data/units-manifest.js"></script><script type="module" src="chaos.js"></script></body></html>
