<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TTT Listening & Transcription | Arabic Study</title>
  <style>
  :root {
    --p:#6750a4;
    --pc:#e9ddff;
    --opc:#21005d;
    --s:#fffbfe;
    --sl:#f7f2fa;
    --sh:#ece6f0;
    --ink:#1c1b1f;
    --v:#49454f;
    --o:#79747e;
    --ov:#cac4d0;
    --success:#087443;
    --r:20px;
  }

  * { box-sizing:border-box; }

  body {
    margin:0;
    background:var(--s);
    color:var(--ink);
    font:16px/1.5 "Noto Sans","Noto Sans Arabic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  button,a { font:inherit; -webkit-tap-highlight-color:transparent; }
  button { cursor:pointer; }

  header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    min-height:72px;
    padding:12px max(16px,calc((100% - 760px)/2));
    background:var(--s);
    color:var(--ink);
    border-bottom:1px solid var(--ov);
  }

  header a {
    display:inline-flex;
    align-items:center;
    min-height:44px;
    padding:0 14px;
    border-radius:999px;
    color:var(--p);
    font-weight:800;
    text-decoration:none;
  }

  header a:hover { background:var(--sl); }

  main {
    width:min(100%,760px);
    margin:0 auto;
    padding:24px 16px 56px;
  }

  h1 {
    margin:0 0 5px;
    font-size:clamp(2rem,8vw,2.8rem);
    line-height:1.1;
    letter-spacing:-.04em;
  }

  .lede {
    margin:0 0 24px;
    color:var(--v);
  }

  .selectors,
  .activity {
    border:1px solid var(--ov);
    border-radius:var(--r);
    background:var(--s);
    box-shadow:none;
  }

  .selectors {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:20px;
    padding:20px;
  }

  label {
    display:grid;
    gap:6px;
    color:var(--ink);
    font-weight:800;
  }

  select,
  input,
  textarea,
  button { font:inherit; }

  select,
  input,
  textarea {
    width:100%;
    border:1px solid var(--o);
    border-radius:12px;
    padding:11px 12px;
    background:var(--s);
    color:var(--ink);
  }

  select:focus,
  input:focus,
  textarea:focus {
    border-color:var(--p);
    outline:2px solid var(--p);
    outline-offset:1px;
  }

  textarea {
    min-height:120px;
    resize:vertical;
    direction:rtl;
    text-align:right;
    font-size:1.1rem;
  }

  .inline-blank {
    display:inline-block;
    width:10ch;
    max-width:100%;
    margin:0 .18em;
    padding:.16em .35em;
    direction:rtl;
    text-align:center;
    vertical-align:baseline;
    border:0;
    border-bottom:2px solid var(--p);
    border-radius:0;
    background:var(--sl);
  }

  .empty {
    padding:18px;
    border:1px solid var(--ov);
    border-radius:var(--r);
    background:var(--sl);
    color:var(--v);
  }

  .activity {
    margin:14px 0;
    padding:20px;
  }

  .activity-top {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  .number {
    display:inline-grid;
    place-items:center;
    width:40px;
    height:40px;
    border-radius:14px;
    background:var(--pc);
    color:var(--opc);
    font-weight:800;
  }

  .type {
    color:var(--v);
    font-size:.9rem;
  }

  .prompt {
    margin:18px 0;
    direction:rtl;
    text-align:right;
    font-size:1.25rem;
  }

  .instruction {
    margin:8px 0 16px;
    color:var(--v);
  }

  .audio-toggle {
    min-height:48px;
    padding:0 20px;
    border:0;
    border-radius:999px;
    background:var(--p);
    color:#fff;
    font-weight:800;
  }

  .audio-toggle:hover { box-shadow:0 2px 5px rgb(0 0 0 / .18); }

  .audio-toggle:disabled {
    cursor:not-allowed;
    opacity:.45;
  }

  .player {
    display:none;
    margin:14px 0;
    padding:12px;
    border-radius:15px;
    background:var(--sl);
  }

  .player.open { display:block; }
  audio { width:100%; }

  .saved {
    min-height:1.3em;
    margin-top:9px;
    color:var(--success);
    font-size:.85rem;
    font-weight:700;
  }

  .notice {
    margin:18px 0;
    padding:14px 16px;
    border-left:4px solid var(--p);
    border-radius:0 15px 15px 0;
    background:var(--pc);
    color:var(--opc);
  }

  :focus-visible {
    outline:3px solid var(--p);
    outline-offset:3px;
  }

    .brand-link {
  color:var(--ink);
}

.icon-button {
  display:grid;
  place-items:center;
  width:46px;
  height:46px;
  padding:0;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--v);
  font-size:1.7rem;
  line-height:1;
}

.icon-button:hover { background:rgb(29 27 32 / .08); }

.drawer-backdrop {
  position:fixed;
  inset:0;
  z-index:20;
  background:rgb(29 27 32 / .12);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease;
}

.drawer-backdrop.open {
  opacity:1;
  pointer-events:auto;
}

.drawer {
  position:fixed;
  top:0;
  right:0;
  bottom:0;
  z-index:21;
  display:flex;
  flex-direction:column;
  width:min(86vw,340px);
  padding:max(18px,env(safe-area-inset-top)) 16px 24px;
  background:var(--s);
  box-shadow:-8px 0 26px rgb(0 0 0 / .18);
  transform:translateX(105%);
  transition:transform .22s ease;
}

.drawer.open { transform:translateX(0); }

.drawer-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:56px;
  margin-bottom:16px;
}

.drawer-head strong { font-size:1.1rem; }

.drawer-links {
  display:grid;
  gap:8px;
}

.drawer-links a,
.drawer-item {
  display:flex;
  align-items:center;
  width:100%;
  min-height:54px;
  padding:0 14px;
  border:0;
  border-radius:16px;
  background:transparent;
  color:var(--ink);
  font:700 .95rem/1.2 "Noto Sans","Noto Sans Arabic",system-ui,sans-serif;
  text-align:left;
  text-decoration:none;
}

.drawer-links a:hover,
.drawer-item:hover { background:var(--sl); }

.drawer-links a[aria-current="page"] {
  background:var(--pc);
  color:var(--opc);
}

#firebase-auth {
  margin-top:auto;
}

.firebase-menu-divider {
  height:1px;
  margin:16px 0 12px;
  background:var(--ov);
}

.firebase-google-mark {
  display:grid;
  place-items:center;
  width:24px;
  height:24px;
  margin-right:14px;
  border-radius:50%;
  background:#fff;
  color:#4285f4;
  font-weight:800;
}

.firebase-auth-message {
  display:block;
  padding:8px 14px 0;
  color:var(--v);
  font-size:.78rem;
}

  @media (min-width:700px) {
    main { padding:28px 32px 56px; }
  }

  @media (max-width:600px) {
    .selectors { grid-template-columns:1fr; }
    header { padding:12px 16px; }
    .inline-blank { width:8ch; }
  }

  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after {
      scroll-behavior:auto!important;
      transition-duration:.01ms!important;
    }
  }
</style>
</head>
<body>
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

<aside id="drawer" class="drawer" aria-label="Site menu" aria-hidden="true">
  <div class="drawer-head">
    <strong>Arabic Study</strong>

    <button id="closeMenuButton" class="icon-button" type="button" aria-label="Close menu">
      ×
    </button>
  </div>

  <nav class="drawer-links" aria-label="Primary navigation">
    <a href="arabic.html">Home</a>
    <a href="docs.html">Documentation</a>
    <a href="flashcards.html">Flashcards</a>
    <a href="quiz.html">Quiz</a>
    <a href="match.html">Match</a>
    <a href="ttt.html" aria-current="page">TTT Listening</a>
  </nav>

  <div id="firebase-auth"></div>
</aside>
 <header>
  <a class="brand-link" href="arabic.html">Arabic Study</a>

  <button
    id="menuButton"
    class="icon-button"
    type="button"
    aria-label="Open menu"
    aria-expanded="false"
    aria-controls="drawer"
  >
    ☰
  </button>
</header>
  <main>
    <h1>TTT Listening & Transcription</h1>
    <section class="selectors" aria-label="TTT chapter selection">
      <label>Unit<select id="unitSelect"><option value="">Loading units…</option></select></label>
      <label>Chapter<select id="chapterSelect" disabled><option value="">Choose a unit first</option></select></label>
    </section>
    <div id="status" class="notice">Choose a unit and chapter. Only migrated TTT chapters appear here.</div>
    <section id="activities" aria-live="polite"></section>
  </main>
  <script type="module">
  import { auth, db } from "./firebase-auth.js";
  import {
    doc,
    getDoc,
    serverTimestamp,
    setDoc
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  window.TttCloudStore = {
    get user() {
      return auth.currentUser;
    },

    ref(user, unitId, chapterId) {
      return doc(db, "users", user.uid, "ttt", `${unitId}_${chapterId}`);
    },

    selectionRef(user) {
      return doc(db, "users", user.uid, "ttt", "selection");
    },

    async loadChapter(unitId, chapterId) {
      const user = auth.currentUser;
      if (!user) return null;

      const snapshot = await getDoc(this.ref(user, unitId, chapterId));
      return snapshot.exists() ? snapshot.data().drafts || {} : {};
    },

    async saveChapter(unitId, chapterId, drafts) {
      const user = auth.currentUser;
      if (!user) return false;

      await setDoc(
        this.ref(user, unitId, chapterId),
        {
          drafts,
          updatedAt: serverTimestamp()
        },
        { merge:true }
      );

      return true;
    },

    async loadSelection() {
      const user = auth.currentUser;
      if (!user) return null;

      const snapshot = await getDoc(this.selectionRef(user));
      return snapshot.exists() ? snapshot.data() : null;
    },

    async saveSelection(unitId, chapterId) {
      const user = auth.currentUser;
      if (!user) return false;

      await setDoc(
        this.selectionRef(user),
        {
          unitId,
          chapterId,
          updatedAt: serverTimestamp()
        },
        { merge:true }
      );

      return true;
    }
  };
</script>
  <script>
    const dataRoot = 'data/ttt/';
    const unitSelect = document.querySelector('#unitSelect');
    const chapterSelect = document.querySelector('#chapterSelect');
    const status = document.querySelector('#status');
    const activities = document.querySelector('#activities');
    let manifest = { units: [] }, activeAudio = null;
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let currentDrafts = {};
let saveTimer = null;

const readDrafts = async chapter => {
  const cloud = window.TttCloudStore;

  if (!cloud?.user) return {};
  return await cloud.loadChapter(chapter.unitId, chapter.chapterId);
};

const saveDrafts = (chapter, drafts) => {
  currentDrafts = drafts;
  window.clearTimeout(saveTimer);

  saveTimer = window.setTimeout(async () => {
    const cloud = window.TttCloudStore;
    if (!cloud?.user) return;

    try {
      await cloud.saveChapter(chapter.unitId, chapter.chapterId, currentDrafts);
      document.querySelectorAll(".saved").forEach(el => {
        el.textContent = "Saved to your Google account";
        clearTimeout(el.timer);
        el.timer = setTimeout(() => el.textContent = "", 1800);
      });
    } catch (error) {
      console.error("TTT cloud save failed:", error);
      document.querySelectorAll(".saved").forEach(el => {
        el.textContent = "Could not sync. Check your connection.";
      });
    }
  }, 650);
};
    const inlinePrompt = (prompt, number, draft) => esc(prompt).replace(/\{\{blank:(\d+)\}\}/g, (_, index) => `<input class="inline-blank" type="text" lang="ar" dir="rtl" data-blank="blank:${index}" aria-label="Answer ${index} for activity ${number}" value="${esc(draft[`blank:${index}`] || '')}">`);

    async function loadManifest() {
      try {
        const response = await fetch(dataRoot + 'manifest.json');
        if (!response.ok) throw new Error();
        manifest = await response.json();
        const units = manifest.units || [];
        unitSelect.innerHTML = '<option value="">Choose a unit</option>' + units.map(u => `<option value="${esc(u.id)}">${esc(u.title || u.id)}</option>`).join('');
        const saved = await window.TttCloudStore?.loadSelection() || {};
        if (saved.unitId && units.some(u => u.id === saved.unitId)) { unitSelect.value = saved.unitId; populateChapters(saved.chapterId); }
        status.textContent = units.length ? 'Choose an available TTT chapter.' : 'No TTT chapters have been migrated yet.';
      } catch {
        unitSelect.innerHTML = '<option value="">No TTT content available</option>';
        status.className = 'empty'; status.textContent = 'TTT is ready for content. Add a manifest and chapter JSON files to publish migrated chapters.';
      }
    }
    function populateChapters(selectedId = '') {
      const unit = (manifest.units || []).find(u => u.id === unitSelect.value);
      const chapters = unit?.chapters || [];
      chapterSelect.disabled = !chapters.length;
      chapterSelect.innerHTML = '<option value="">Choose a chapter</option>' + chapters.map(ch => `<option value="${esc(ch.id)}">${esc(ch.title || ch.id)}</option>`).join('');
      activities.innerHTML = '';
      if (selectedId && chapters.some(ch => ch.id === selectedId)) { chapterSelect.value = selectedId; loadChapter(); }
    }
    async function loadChapter() {
      const unit = (manifest.units || []).find(u => u.id === unitSelect.value);
      const chapterRef = (unit?.chapters || []).find(ch => ch.id === chapterSelect.value);
      if (!chapterRef) return;
      window.TttCloudStore?.saveSelection(unit.id, chapterRef.id);
      status.className = 'notice'; status.textContent = 'Loading chapter…'; activities.innerHTML = '';
      try {
        const response = await fetch(dataRoot + chapterRef.file);
        if (!response.ok) throw new Error();
        await renderChapter(await response.json());
      } catch {
        status.className = 'empty'; status.textContent = 'This TTT chapter could not be loaded. Check its manifest path and JSON file.';
      }
    }
    async function renderChapter(chapter) {
  const drafts = await readDrafts(chapter);
      currentDrafts = drafts;
      status.className = 'notice'; status.textContent = chapter.title || 'TTT chapter';
      activities.innerHTML = (chapter.activities || []).map(activity => {
        const draft = drafts[activity.number] || {};
        const isBlank = activity.type === 'fill-blank';
        const hasAudio = Boolean(activity.audio);
        const answer = isBlank ? '' : `<textarea lang="ar" dir="rtl" aria-label="Transcription for activity ${activity.number}" placeholder="اكتب ما تسمع هنا">${esc(typeof draft === 'string' ? draft : '')}</textarea>`;
        return `<article class="activity" data-number="${activity.number}" data-type="${esc(activity.type)}"><div class="activity-top"><span class="number">${activity.number}</span><span class="type">${isBlank ? 'Fill in the blank' : 'Full transcription'}</span></div>${activity.promptArabic ? `<p class="prompt" lang="ar">${isBlank ? inlinePrompt(activity.promptArabic, activity.number, typeof draft === 'object' ? draft : {}) : esc(activity.promptArabic)}</p>` : ''}${activity.instruction ? `<p class="instruction">${esc(activity.instruction)}</p>` : ''}${activity.translationRequired ? '<p class="instruction">Translate your completed response into English.</p>' : ''}<button class="audio-toggle" type="button" ${hasAudio ? '' : 'disabled'}>${hasAudio ? 'Play audio' : 'Audio coming soon'}</button><div class="player"><audio preload="metadata" controls src="${esc((chapter.audioBasePath || '') + activity.audio)}"></audio></div>${answer}<div class="saved"></div></article>`;
      }).join('');
      activities.querySelectorAll('.audio-toggle:not(:disabled)').forEach(button => button.addEventListener('click', () => { const player = button.nextElementSibling; player.classList.toggle('open'); button.textContent = player.classList.contains('open') ? 'Hide audio' : 'Play audio'; }));
      activities.querySelectorAll('audio').forEach(audio => audio.addEventListener('play', () => { if (activeAudio && activeAudio !== audio) activeAudio.pause(); activeAudio = audio; }));
      activities.querySelectorAll('.activity').forEach(card => {
        const persist = () => {
          const current = currentDrafts;
          current[card.dataset.number] = card.dataset.type === 'fill-blank' ? Object.fromEntries([...card.querySelectorAll('[data-blank]')].map(input => [input.dataset.blank, input.value])) : card.querySelector('textarea').value;
          saveDrafts(chapter, current);
          const saved = card.querySelector('.saved'); saved.textContent = 'Saved locally'; clearTimeout(saved.timer); saved.timer = setTimeout(() => saved.textContent = '', 1400);
        };
        card.querySelectorAll('input, textarea').forEach(field => field.addEventListener('input', persist));
      });
    }
    unitSelect.addEventListener('change', () => populateChapters());
    chapterSelect.addEventListener('change', loadChapter);
    const menuButton = document.querySelector("#menuButton");
const closeMenuButton = document.querySelector("#closeMenuButton");
const drawer = document.querySelector("#drawer");
const drawerBackdrop = document.querySelector("#drawerBackdrop");

function setDrawer(open) {
  drawer.classList.toggle("open", open);
  drawerBackdrop.classList.toggle("open", open);
  drawer.setAttribute("aria-hidden", String(!open));
  menuButton.setAttribute("aria-expanded", String(open));

  if (open) closeMenuButton.focus();
  else menuButton.focus();
}

menuButton.addEventListener("click", () => setDrawer(true));
closeMenuButton.addEventListener("click", () => setDrawer(false));
drawerBackdrop.addEventListener("click", () => setDrawer(false));

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && drawer.classList.contains("open")) {
    setDrawer(false);
  }
});
    loadManifest();
  </script>
</body>
</html>
