<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6750a4">
  <meta name="description" content="Arabic vocabulary flashcards for Unit 7.">
  <title>Flashcards — Arabic Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#6750a4;--on-primary:#fff;--primary-container:#e9ddff;--on-primary-container:#21005d;--surface:#fffbfe;--surface-low:#f7f2fa;--surface-high:#ece6f0;--on-surface:#1c1b1f;--variant:#49454f;--outline:#79747e;--outline-variant:#cac4d0;--radius-lg:28px;--radius-md:18px}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--on-surface);font-family:"Noto Sans","Noto Sans Arabic",sans-serif}.app{width:min(100%,760px);min-height:100dvh;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.topbar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;min-height:56px}.icon-button{display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:transparent;color:var(--variant);text-decoration:none}.heading{text-align:center}.eyebrow{margin:0;color:var(--variant);font-size:.78rem;font-weight:700;letter-spacing:.04em}.title{margin:2px 0 0;font-size:1rem;font-weight:800}main{flex:1;padding:20px 0}.intro{text-align:center}.intro p{margin:6px auto 0;color:var(--variant);font-size:.9rem}.chapters{display:grid;gap:10px;margin:24px 0}.chapter{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 14px;border:2px solid transparent;border-radius:var(--radius-md);background:var(--surface-low);color:inherit;text-align:left;font:inherit;cursor:pointer}.chapter:hover{background:var(--surface-high)}.chapter.active{border-color:var(--primary);background:var(--primary-container)}.chapter-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:#e8def8;color:var(--on-primary-container)}.chapter-title{font-weight:800}.chapter-meta{display:block;margin-top:3px;color:var(--variant);font-size:.76rem}.chapter-count{padding:4px 9px;border-radius:999px;background:var(--surface-high);color:var(--variant);font-size:.68rem;font-weight:800}.study{display:none;margin-top:24px}.study.visible{display:block}.progress{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;color:var(--variant);font-size:.8rem;font-weight:700}.card{position:relative;min-height:300px;perspective:1200px;cursor:pointer}.card-inner{position:absolute;inset:0;transition:transform .55s;transform-style:preserve-3d}.card.flipped .card-inner{transform:rotateY(180deg)}.card.no-transition .card-inner {
  transition: none;
}.face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px;border:2px solid var(--outline-variant);border-radius:var(--radius-lg);backface-visibility:hidden;text-align:center;background:var(--surface);box-shadow:0 4px 16px rgb(0 0 0/.08)}.back{transform:rotateY(180deg);background:var(--primary-container);border-color:var(--primary)}.label{position:absolute;top:18px;color:var(--variant);font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.arabic{font-family:"Noto Sans Arabic",sans-serif;font-size:clamp(1.65rem,7vw,2.6rem);font-weight:700;line-height:1.6;direction:rtl}.english{font-size:clamp(1.3rem,5vw,2rem);font-weight:800;line-height:1.45}.hint{position:absolute;bottom:18px;color:var(--variant);font-size:.75rem}.controls{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:0 19px;border:0;border-radius:999px;font:inherit;font-size:.86rem;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:var(--on-primary)}.tonal{background:var(--primary-container);color:var(--on-primary-container)}.text{background:transparent;color:var(--primary)}button:focus-visible,a:focus-visible{outline:3px solid var(--primary);outline-offset:3px}@media(min-width:700px){.app{padding:32px}.chapters{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){.card-inner{transition:none}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-button" href="arabic.html" aria-label="Return to Arabic study home"><span class="material-symbols-rounded">close</span></a>
      <div class="heading"><p class="eyebrow">Flashcards</p><p class="title">Unit 7 vocabulary</p></div>
      <span></span>
    </header>
    <main>
      <section class="intro"><h1>Choose a chapter</h1><p>Study Arabic-to-English vocabulary one card at a time.</p></section>
      <section class="chapters" id="chapters" aria-label="Chapter selection"></section>
      <section class="study" id="study" aria-live="polite">
        <div class="progress"><span id="chapter-name"></span><span id="progress-text"></span></div>
        <div class="card" id="card" role="button" tabindex="0" aria-label="Flashcard. Select to flip.">
          <div class="card-inner">
            <div class="face"><span class="label">Arabic</span><div class="arabic" id="arabic-term" lang="ar"></div><span class="hint">Select to reveal meaning</span></div>
            <div class="face back"><span class="label">English</span><div class="english" id="english-meaning"></div><span class="hint">Select to see Arabic</span></div>
          </div>
        </div>
        <div class="controls">
          <button class="button tonal" id="previous" type="button">Previous</button>
          <button class="button primary" id="flip" type="button">Flip card</button>
          <button class="button tonal" id="next" type="button">Next</button>
          <button class="button text" id="shuffle" type="button">Shuffle</button>
        </div>
      </section>
    </main>
  </div>
  <script>
    const chaptersEl=document.getElementById('chapters');const study=document.getElementById('study');const card=document.getElementById('card');let data=null,active=null,cards=[],index=0;
    const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
    function meaning(q){return q.choices[q.answer]}
    function renderChapters(){chaptersEl.innerHTML='';Object.entries(data.chapters).filter(([id,c])=>c.number>=31&&c.number<=35).forEach(([id,c])=>{const b=document.createElement('button');b.type='button';b.className='chapter'+(id===active?' active':'');b.innerHTML='<span class="chapter-icon material-symbols-rounded">style</span><span><span class="chapter-title">'+esc(c.title)+'</span><span class="chapter-meta">Unit 7</span></span><span class="chapter-count">'+c.questions.length+' cards</span>';b.onclick=()=>loadChapter(id);chaptersEl.appendChild(b)})}
    function loadChapter(id){active=id;cards=data.chapters[id].questions.map(q=>({arabic:q.arabic,english:meaning(q)}));index=0;study.classList.add('visible');renderChapters();renderCard();study.scrollIntoView({behavior:'smooth',block:'start'})}
    function renderCard() {
  if (!cards.length) return;

  const item = cards[index];

  // Reset instantly before loading the next/previous card.
  // This prevents the outgoing answer from appearing during a reverse flip.
  card.classList.add('no-transition');
  card.classList.remove('flipped');

  document.getElementById('arabic-term').textContent = item.arabic;
  document.getElementById('english-meaning').textContent = item.english;
  document.getElementById('chapter-name').textContent = data.chapters[active].title;
  document.getElementById('progress-text').textContent = `${index + 1} / ${cards.length}`;

  // Forces the no-transition front-side state to render before re-enabling animation.
  void card.offsetWidth;

  card.classList.remove('no-transition');
}
    function move(n){index=(index+n+cards.length)%cards.length;renderCard()}
    function toggle(){card.classList.toggle('flipped')}
    document.getElementById('previous').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('flip').onclick=toggle;document.getElementById('shuffle').onclick=()=>{cards=shuffle(cards);index=0;renderCard()};card.onclick=toggle;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}};
    fetch('data/unit7.json').then(r=>{if(!r.ok)throw new Error('Could not load Unit 7 vocabulary.');return r.json()}).then(json=>{data=json;renderChapters()}).catch(err=>{chaptersEl.innerHTML='<p>'+esc(err.message)+'</p>'});
  </script>
</body>
</html>
