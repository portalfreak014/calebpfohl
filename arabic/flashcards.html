<!doctype html>
<html lang="en" data-firebase-auth-ui="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6750a4">
  <meta name="description" content="Arabic vocabulary flashcards for Unit 8 and community-created sets.">
  <title>Flashcards — Arabic Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#6750a4;--on-primary:#fff;--primary-container:#e9ddff;--on-primary-container:#21005d;--surface:#fffbfe;--surface-low:#f7f2fa;--surface-high:#ece6f0;--on-surface:#1c1b1f;--variant:#49454f;--outline:#79747e;--outline-variant:#cac4d0;--radius-lg:28px;--radius-md:18px}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--on-surface);font-family:"Noto Sans","Noto Sans Arabic",sans-serif}.app{width:min(100%,760px);min-height:100dvh;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.topbar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;min-height:56px}.icon-button{display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:transparent;color:var(--variant);text-decoration:none}.heading{text-align:center}.eyebrow{margin:0;color:var(--variant);font-size:.78rem;font-weight:700;letter-spacing:.04em}.title{margin:2px 0 0;font-size:1rem;font-weight:800}main{flex:1;padding:20px 0}.intro{text-align:center}.intro p{margin:6px auto 0;color:var(--variant);font-size:.9rem}.chapters{display:grid;gap:10px;margin:24px 0}.chapter{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 14px;border:2px solid transparent;border-radius:var(--radius-md);background:var(--surface-low);color:inherit;text-align:left;font:inherit;cursor:pointer}.chapter:hover{background:var(--surface-high)}.chapter.active{border-color:var(--primary);background:var(--primary-container)}.chapter-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:#e8def8;color:var(--on-primary-container)}.chapter-title{font-weight:800}.chapter-meta{display:block;margin-top:3px;color:var(--variant);font-size:.76rem}.chapter-count{padding:4px 9px;border-radius:999px;background:var(--surface-high);color:var(--variant);font-size:.68rem;font-weight:800}.community{margin-top:28px;padding-top:24px;border-top:1px solid #eee7f7}.community-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.community-heading h2{margin:0;font-size:1.1rem}.community-copy{margin:6px 0 0;color:var(--variant);font-size:.85rem}.community .chapters{margin:16px 0}.community-empty,.community-message{margin:16px 0;color:var(--variant);font-size:.85rem}.creator{margin:16px 0 0;padding:16px;border-radius:var(--radius-md);background:var(--surface-low)}.creator[hidden]{display:none}.creator-title{margin:0 0 12px;font-size:1rem}.field{display:grid;gap:6px;margin:12px 0}.field label,.card-fields label{color:var(--variant);font-size:.78rem;font-weight:800}.field input,.card-fields input{width:100%;min-height:46px;padding:0 12px;border:1px solid var(--outline-variant);border-radius:12px;background:var(--surface);color:var(--on-surface);font:inherit}.card-fields{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin:12px 0}.card-fields .field{margin:0}.remove-card{min-height:46px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:var(--primary);font:inherit;font-size:.82rem;font-weight:800;cursor:pointer}.creator-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.study{display:none;margin-top:28px;padding:18px 0 4px;border-top:1px solid #eee7f7}.study.visible{display:block}.study-header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;margin-bottom:14px}.back-to-sets{min-height:38px;padding:0 14px;border:0;border-radius:999px;background:var(--primary-container);color:var(--on-primary-container);font:800 .8rem "Noto Sans","Noto Sans Arabic",sans-serif;cursor:pointer;white-space:nowrap}.study-title{min-width:0;overflow:hidden;color:var(--variant);font-size:.8rem;font-weight:800;text-align:right;text-overflow:ellipsis;white-space:nowrap}.progress{color:var(--variant);font-size:.8rem;font-weight:700;white-space:nowrap}.card{position:relative;min-height:300px;perspective:1200px;cursor:pointer}.card-inner{position:absolute;inset:0;transition:transform .55s;transform-style:preserve-3d}.card.flipped .card-inner{transform:rotateY(180deg)}.card.no-transition .card-inner{transition:none}.face,.card-inner{pointer-events:none}.face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px;border:2px solid var(--outline-variant);border-radius:var(--radius-lg);backface-visibility:hidden;text-align:center;background:var(--surface);box-shadow:0 4px 16px rgb(0 0 0/.08)}.back{transform:rotateY(180deg);background:var(--primary-container);border-color:var(--primary)}.label{position:absolute;top:18px;color:var(--variant);font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.arabic{font-family:"Noto Sans Arabic",sans-serif;font-size:clamp(1.65rem,7vw,2.6rem);font-weight:700;line-height:1.6;direction:rtl}.english{font-size:clamp(1.3rem,5vw,2rem);font-weight:800;line-height:1.45}.hint{position:absolute;bottom:18px;color:var(--variant);font-size:.75rem}.controls{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:0 19px;border:0;border-radius:999px;font:inherit;font-size:.86rem;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:var(--on-primary)}.tonal{background:var(--primary-container);color:var(--on-primary-container)}.text{background:transparent;color:var(--primary)}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:3px}@media(min-width:700px){.app{padding:32px}.chapters{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.card-fields{grid-template-columns:1fr}.remove-card{justify-self:start}.study-header{gap:8px}.back-to-sets{padding:0 12px}}@media(prefers-reduced-motion:reduce){.card-inner{transition:none}}
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="icon-button" href="arabic.html" aria-label="Return to Arabic study home"><span class="material-symbols-rounded">close</span></a>
      <div class="heading"><p class="eyebrow">Flashcards</p><p class="title">Unit 8 vocabulary</p></div>
      <span></span>
    </header>
    <main>
      <section class="intro"><h1>Choose a chapter</h1><p>Study Arabic-to-English vocabulary one card at a time.</p></section>
      <div id="selection">
        <section class="chapters" id="chapters" aria-label="Chapter selection"></section>
        <section class="community" aria-labelledby="community-title">
          <div class="community-heading"><h2 id="community-title">Community flashcards</h2><button class="button tonal" id="create-set" type="button">Create a set</button></div>
          <p class="community-copy">Flashcard sets shared by other students.</p>
          <p class="community-message" id="community-message" role="status"></p>
          <section class="chapters" id="community-sets" aria-label="Community flashcard sets"></section>
          <form class="creator" id="creator" hidden novalidate>
            <h3 class="creator-title">Create a set</h3>
            <div class="field"><label for="set-title">Set title</label><input id="set-title" name="title" maxlength="80" required></div>
            <div id="card-fields"></div>
            <div class="creator-actions"><button class="button tonal" id="add-card" type="button">Add card</button><button class="button primary" type="submit">Publish set</button></div>
          </form>
        </section>
      </div>
      <section class="study" id="study" aria-live="polite">
        <div class="study-header"><button class="back-to-sets" id="back-to-sets" type="button">All sets</button><span class="study-title" id="chapter-name"></span><span class="progress" id="progress-text"></span></div>
        <div class="card" id="card" role="button" tabindex="0" aria-label="Flashcard. Select to flip.">
          <div class="card-inner">
            <div class="face"><span class="label">Arabic</span><div class="arabic" id="arabic-term" lang="ar"></div><span class="hint">Select to reveal meaning</span></div>
            <div class="face back"><span class="label">English</span><div class="english" id="english-meaning"></div><span class="hint">Select to see Arabic</span></div>
          </div>
        </div>
        <div class="controls">
          <button class="button tonal" id="previous" type="button">Previous</button>
          <button class="button primary" id="flip" type="button">Flip card</button>
          <button class="button tonal" id="next" type="button">Next</button>
          <button class="button text" id="shuffle" type="button">Shuffle</button>
        </div>
      </section>
    </main>
  </div>
  <script type="module">
    import { auth, db } from './firebase-auth.js';
    import { addDoc, collection, getDocs, orderBy, query, serverTimestamp, where } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

    const chaptersEl=document.getElementById('chapters');const communitySetsEl=document.getElementById('community-sets');const communityMessage=document.getElementById('community-message');const createSetButton=document.getElementById('create-set');const creator=document.getElementById('creator');const cardFields=document.getElementById('card-fields');const study=document.getElementById('study');const card=document.getElementById('card');let data=null,active=null,cards=[],index=0,activeTitle='',communitySets=[];
    const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
    const meaning=q=>q.choices[q.answer];
    const setCommunityMessage=text=>communityMessage.textContent=text||'';
    function renderChapters(){if(!data)return;chaptersEl.innerHTML='';Object.entries(data.chapters).filter(([id,c])=>c.number>=36&&c.number<=40).forEach(([id,c])=>{const b=document.createElement('button');b.type='button';b.className='chapter'+(id===active?' active':'');b.innerHTML='<span class="chapter-icon material-symbols-rounded">style</span><span><span class="chapter-title">'+esc(c.title)+'</span><span class="chapter-meta">Unit 8</span></span><span class="chapter-count">'+c.questions.length+' cards</span>';b.onclick=()=>loadCourseChapter(id);chaptersEl.appendChild(b)})}
    function renderCommunitySets(){communitySetsEl.innerHTML='';if(!communitySets.length){communitySetsEl.innerHTML='<p class="community-empty">No community sets yet. Be the first to create one.</p>';return}communitySets.forEach(set=>{const b=document.createElement('button');b.type='button';b.className='chapter'+(active===`community:${set.id}`?' active':'');b.innerHTML='<span class="chapter-icon material-symbols-rounded">groups</span><span><span class="chapter-title">'+esc(set.title)+'</span><span class="chapter-meta">By '+esc(set.ownerName||'Community member')+'</span></span><span class="chapter-count">'+set.cards.length+' cards</span>';b.onclick=()=>loadCommunitySet(set);communitySetsEl.appendChild(b)})}
    function startCards(nextCards,title,id){active=id;activeTitle=title;cards=nextCards;index=0;study.classList.add('visible');renderChapters();renderCommunitySets();renderCard();requestAnimationFrame(()=>study.scrollIntoView({behavior:'smooth',block:'center'}))}
    function leaveStudy(){study.classList.remove('visible');active=null;renderChapters();renderCommunitySets();window.scrollTo({top:0,behavior:'smooth'})}
    function loadCourseChapter(id){const chapter=data.chapters[id];startCards(chapter.questions.map(q=>({arabic:q.arabic,english:meaning(q)})),chapter.title,id)}
    function loadCommunitySet(set){startCards(set.cards,set.title,`community:${set.id}`)}
    function renderCard(){if(!cards.length)return;const item=cards[index];card.classList.add('no-transition');card.classList.remove('flipped');document.getElementById('arabic-term').textContent=item.arabic;document.getElementById('english-meaning').textContent=item.english;document.getElementById('chapter-name').textContent=activeTitle;document.getElementById('progress-text').textContent=`${index+1} / ${cards.length}`;void card.offsetWidth;card.classList.remove('no-transition')}
    function move(n){index=(index+n+cards.length)%cards.length;renderCard()}
    function toggle(event){event?.preventDefault();card.classList.toggle('flipped')}
    function addCardRow(){const row=document.createElement('div');row.className='card-fields';row.innerHTML='<div class="field"><label>Arabic<input class="new-card-arabic" lang="ar" dir="rtl" maxlength="160" required></label></div><div class="field"><label>English<input class="new-card-english" maxlength="160" required></label></div><button class="remove-card" type="button">Remove</button>';row.querySelector('.remove-card').onclick=()=>{if(cardFields.children.length>2)row.remove();else setCommunityMessage('A set needs at least two cards.');};cardFields.appendChild(row)}
    function resetCreator(){document.getElementById('set-title').value='';cardFields.innerHTML='';addCardRow();addCardRow()}
    async function loadCommunitySets(){setCommunityMessage('');try{const published=query(collection(db,'communityFlashcards'),where('visibility','==','public'),where('status','==','published'),orderBy('createdAt','desc'));const snapshot=await getDocs(published);communitySets=snapshot.docs.map(doc=>({id:doc.id,...doc.data(),cards:Array.isArray(doc.data().cards)?doc.data().cards:[]})).filter(set=>set.title&&set.cards.length);renderCommunitySets()}catch(error){console.error('Could not load community flashcards:',error);setCommunityMessage('Community sets could not be loaded right now.');renderCommunitySets()}}
    createSetButton.onclick=()=>{if(!auth.currentUser){setCommunityMessage('Log in with Google from the main menu to create a set.');return}creator.hidden=!creator.hidden;if(!creator.hidden){setCommunityMessage('');document.getElementById('set-title').focus()}}
    document.getElementById('add-card').onclick=addCardRow;
    creator.addEventListener('submit',async event=>{event.preventDefault();const user=auth.currentUser;if(!user){setCommunityMessage('Log in with Google from the main menu to publish a set.');return}const title=document.getElementById('set-title').value.trim();const newCards=[...cardFields.querySelectorAll('.card-fields')].map(row=>({arabic:row.querySelector('.new-card-arabic').value.trim(),english:row.querySelector('.new-card-english').value.trim()}));const completeCards=newCards.filter(item=>item.arabic&&item.english);if(!title){setCommunityMessage('Add a title for your set.');return}if(completeCards.length<2||completeCards.length!==newCards.length){setCommunityMessage('Add at least two complete Arabic and English card pairs.');return}const submitButton=creator.querySelector('[type="submit"]');submitButton.disabled=true;setCommunityMessage('Publishing your set…');try{await addDoc(collection(db,'communityFlashcards'),{title,ownerId:user.uid,ownerName:user.displayName||'Community member',cards:completeCards,visibility:'public',status:'published',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});resetCreator();creator.hidden=true;setCommunityMessage('Your set is published.');await loadCommunitySets()}catch(error){console.error('Could not publish community flashcards:',error);setCommunityMessage('Your set could not be published. Please try again.')}finally{submitButton.disabled=false}});
    document.getElementById('back-to-sets').onclick=leaveStudy;document.getElementById('previous').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('flip').addEventListener('click',toggle);document.getElementById('shuffle').onclick=()=>{cards=shuffle(cards);index=0;renderCard()};card.addEventListener('click',toggle);card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle()}});
    fetch('data/unit8.json').then(r=>{if(!r.ok)throw new Error('Could not load Unit 8 vocabulary.');return r.json()}).then(json=>{data=json;renderChapters()}).catch(err=>{chaptersEl.innerHTML='<p>'+esc(err.message)+'</p>'});
    resetCreator();loadCommunitySets();
  </script>
</body>
</html>
