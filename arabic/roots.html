<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freya's Root Reference</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--p:#6750a4;--pc:#e9ddff;--opc:#21005d;--s:#fffbfe;--sl:#f7f2fa;--sh:#ece6f0;--ink:#1c1b1f;--v:#49454f;--o:#79747e;--ov:#cac4d0;--r:20px}*{box-sizing:border-box}body{margin:0;background:var(--s);color:var(--ink);font-family:"Noto Sans","Noto Sans Arabic",sans-serif}.app{width:min(1200px,100%);margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.back{color:var(--p);text-decoration:none;font-weight:700}.top h1{margin:0;font-size:1.7rem}.top p{margin:4px 0 0;color:var(--v);font-size:.9rem}.tools{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}.search{flex:1;min-width:260px;border:1px solid var(--o);border-radius:99px;padding:13px 18px;background:var(--s);font:inherit}.filter{border:0;border-radius:99px;padding:11px 16px;background:var(--sh);color:var(--ink);font:700 .82rem inherit;cursor:pointer}.filter.active{background:var(--p);color:#fff}.count{color:var(--v);font-size:.85rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.root{border:1px solid var(--ov);border-radius:var(--r);background:var(--s);overflow:hidden}.root summary{list-style:none;cursor:pointer;padding:17px;display:flex;align-items:center;justify-content:space-between;gap:12px}.root summary::-webkit-details-marker{display:none}.root[open] summary{background:var(--pc)}.root-name{font:700 1.25rem "Noto Sans Arabic",sans-serif;direction:rtl}.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.badge{border-radius:99px;padding:4px 8px;background:var(--sh);color:var(--v);font-size:.68rem;font-weight:800}.root[open] .badge{background:#fff9}.content{padding:0 17px 17px}.section-title{margin:16px 0 7px;color:var(--p);font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.thread{margin:0;padding:12px;border-radius:14px;background:var(--sl);font-size:.86rem;line-height:1.55;white-space:pre-wrap}.measures{display:grid;gap:8px}.measure{padding:11px;border:1px solid var(--ov);border-radius:14px}.measure b{display:block;color:var(--p);font-size:.73rem;text-transform:uppercase;letter-spacing:.05em}.measure p{margin:5px 0 0;font-size:.84rem;line-height:1.45}.keys{display:flex;gap:7px;flex-wrap:wrap}.key{padding:7px 10px;border-radius:99px;background:var(--pc);color:var(--opc);font:600 .8rem "Noto Sans Arabic",sans-serif}.empty{padding:30px;text-align:center;color:var(--v);grid-column:1/-1}@media(min-width:900px){.root{grid-column:span 1}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:1180px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><div class="app"><header class="top"><a class="back" href="arabic.html">Back to Arabic Study</a><div><h1>Freya's Root Reference</h1><p>Every root is visible. Open any card to view its full semantic thread, measures, and keywords.</p></div></header><div class="tools"><input id="search" class="search" aria-label="Search roots" placeholder="Search root, thread, measure, or keyword"><button class="filter active" data-f="all">All</button><button class="filter" data-f="measures">Measures</button><button class="filter" data-f="keywords">Keywords</button></div><p class="count" id="count">Loading roots…</p><main class="grid" id="grid"></main></div><script>const grid=document.querySelector('#grid'),search=document.querySelector('#search'),count=document.querySelector('#count');let rows=[],f='all';const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function csv(t){let a=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x==='"'&&q&&n==='"'){c+='"';i++}else if(x==='"')q=!q;else if(x===','&&!q){r.push(c);c=''}else if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c);if(r.some(v=>v.trim()))a.push(r);r=[];c=''}else c+=x}r.push(c);if(r.some(v=>v.trim()))a.push(r);let h=a.shift().map(x=>x.trim());return a.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))}function vals(r,p){return Object.entries(r).filter(([k,v])=>k.toLowerCase().startsWith(p)&&v&&v!=='X')}function ok(r){let s=search.value.toLowerCase();return(f==='all'||f==='measures'&&vals(r,'measure').length||f==='keywords'&&vals(r,'keyword').length)&&(!s||Object.values(r).join(' ').toLowerCase().includes(s))}function render(){let list=rows.filter(ok);count.textContent=list.length+' of '+rows.length+' roots shown';grid.innerHTML=list.length?list.map(r=>{let ms=vals(r,'measure'),ks=vals(r,'keyword');return'<details class="root"><summary><span class="root-name">'+esc(r.Roots)+'</span><span class="badges"><span class="badge">'+ms.length+' measures</span><span class="badge">'+ks.length+' keywords</span></span></summary><div class="content">'+(r.Thread?'<h2 class="section-title">Semantic thread</h2><p class="thread">'+esc(r.Thread)+'</p>':'')+(ms.length?'<h2 class="section-title">Measures</h2><div class="measures">'+ms.map(([k,v])=>'<div class="measure"><b>'+esc(k)+'</b><p>'+esc(v)+'</p></div>').join('')+'</div>':'')+(ks.length?'<h2 class="section-title">Keywords</h2><div class="keys">'+ks.map(([k,v])=>'<span class="key" title="'+esc(k)+'" dir="rtl">'+esc(v)+'</span>').join('')+'</div>':'')+'</div></details>'}).join(''):'<p class="empty">No roots match your search.</p>'}search.oninput=render;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{f=b.dataset.f;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});fetch('data/freyas-roots.csv').then(r=>r.text()).then(t=>{rows=csv(t).filter(r=>r.Roots);render()}).catch(()=>{count.textContent='Could not load the root chart CSV.'});</script></body></html>
