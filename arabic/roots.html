<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freya's Root Reference</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--p:#c4b5fd;--pc:#2f2454;--s:#0d1020;--sl:#141a32;--sh:#202849;--ink:#f1efff;--v:#bcb6d4;--o:#746b9c;--r:18px}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Space Grotesk","Noto Sans Arabic",sans-serif;background:radial-gradient(circle at 8% 0,#34306d 0,transparent 27%),radial-gradient(circle at 92% 8%,#432d6c 0,transparent 30%),var(--s);min-height:100dvh}.app{width:min(1280px,100%);margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.back{color:var(--ink);text-decoration:none;padding:10px 15px;border:1px solid #ffffff30;border-radius:999px;background:#ffffff0b;font-weight:600}.top h1{margin:0;font-size:clamp(1.5rem,3vw,2.2rem);letter-spacing:-.04em}.top p{margin:5px 0 0;color:var(--v);font-size:.9rem}.tools{display:flex;gap:10px;margin:24px 0 12px;flex-wrap:wrap}.search{flex:1;min-width:260px;border:1px solid var(--o);border-radius:14px;padding:13px 16px;background:#0a0f25;color:var(--ink);font:inherit;box-shadow:inset 0 0 16px #9174ff14}.filter{border:1px solid #ffffff1f;border-radius:999px;padding:10px 15px;background:var(--sh);color:var(--ink);font:700 .82rem inherit;cursor:pointer}.filter.active{background:var(--p);color:#21183d;border-color:var(--p);box-shadow:0 0 20px #c4b5fd77}.count{color:var(--v);font-size:.83rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.root{position:relative;border:1px solid #a998ff5b;border-radius:var(--r);background:linear-gradient(135deg,#1b2140e8,#10162de8);overflow:hidden;box-shadow:0 12px 28px #0004}.root:before{content:"";position:absolute;width:120px;height:120px;right:-58px;top:-58px;border-radius:50%;background:#c4b5fd18;filter:blur(4px);pointer-events:none}.root summary{position:relative;list-style:none;cursor:pointer;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.root summary::-webkit-details-marker{display:none}.root[open]{border-color:var(--p);box-shadow:0 0 0 1px #c4b5fd66,0 15px 30px #0005}.root[open] summary{background:linear-gradient(90deg,#c4b5fd25,transparent)}.root-name{font:700 1.3rem "Noto Sans Arabic",sans-serif;direction:rtl}.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.badge{border-radius:999px;padding:5px 8px;background:#ffffff12;color:#d9d2f2;font-size:.67rem;font-weight:800}.content{position:relative;padding:0 18px 18px}.section-title{margin:16px 0 7px;color:var(--p);font-size:.73rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.thread{margin:0;padding:13px;border:1px solid #ffffff18;border-radius:13px;background:#090e21a8;font-size:.85rem;line-height:1.58;white-space:pre-wrap}.measures{display:grid;gap:8px}.measure{padding:11px;border:1px solid #ffffff18;border-radius:13px;background:#111936}.measure b{display:block;color:#8fe9df;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}.measure p{margin:5px 0 0;font-size:.83rem;line-height:1.45}.keys{display:flex;gap:7px;flex-wrap:wrap}.key{padding:7px 10px;border:1px solid #c4b5fd48;border-radius:999px;background:#c4b5fd16;color:#e1dcff;font:600 .8rem "Noto Sans Arabic",sans-serif}.empty{padding:30px;text-align:center;color:var(--v);grid-column:1/-1}@media(min-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:1180px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><div class="app"><header class="top"><a class="back" href="arabic.html">Back to Arabic Study</a><div><h1>Freya's Root Reference</h1><p>All roots remain visible. Expand any card for the full semantic record.</p></div></header><div class="tools"><input id="search" class="search" aria-label="Search roots" placeholder="Search root, thread, measure, or keyword"><button class="filter active" data-f="all">All</button><button class="filter" data-f="measures">Measures</button><button class="filter" data-f="keywords">Keywords</button></div><p class="count" id="count">Loading roots…</p><main class="grid" id="grid"></main></div><script>const grid=document.querySelector('#grid'),search=document.querySelector('#search'),count=document.querySelector('#count');let rows=[],f='all';const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function csv(t){let a=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x==='"'&&q&&n==='"'){c+='"';i++}else if(x==='"')q=!q;else if(x===','&&!q){r.push(c);c=''}else if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c);if(r.some(v=>v.trim()))a.push(r);r=[];c=''}else c+=x}r.push(c);if(r.some(v=>v.trim()))a.push(r);let h=a.shift().map(x=>x.trim());return a.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))}function vals(r,p){return Object.entries(r).filter(([k,v])=>k.toLowerCase().startsWith(p)&&v&&v!=='X')}function ok(r){let s=search.value.toLowerCase();return(f==='all'||f==='measures'&&vals(r,'measure').length||f==='keywords'&&vals(r,'keyword').length)&&(!s||Object.values(r).join(' ').toLowerCase().includes(s))}function render(){let list=rows.filter(ok);count.textContent=list.length+' of '+rows.length+' roots shown';grid.innerHTML=list.length?list.map(r=>{let ms=vals(r,'measure'),ks=vals(r,'keyword');return'<details class="root"><summary><span class="root-name">'+esc(r.Roots)+'</span><span class="badges"><span class="badge">'+ms.length+' measures</span><span class="badge">'+ks.length+' keywords</span></span></summary><div class="content">'+(r.Thread?'<h2 class="section-title">Semantic thread</h2><p class="thread">'+esc(r.Thread)+'</p>':'')+(ms.length?'<h2 class="section-title">Measures</h2><div class="measures">'+ms.map(([k,v])=>'<div class="measure"><b>'+esc(k)+'</b><p>'+esc(v)+'</p></div>').join('')+'</div>':'')+(ks.length?'<h2 class="section-title">Keywords</h2><div class="keys">'+ks.map(([k,v])=>'<span class="key" title="'+esc(k)+'" dir="rtl">'+esc(v)+'</span>').join('')+'</div>':'')+'</div></details>'}).join(''):'<p class="empty">No roots match your search.</p>'}search.oninput=render;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{f=b.dataset.f;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});fetch('data/freyas-roots.csv').then(r=>r.text()).then(t=>{rows=csv(t).filter(r=>r.Roots);render()}).catch(()=>count.textContent='Could not load the root chart CSV.');</script></body></html>
