<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f2fa">
  <meta name="description" content="Freya's Arabic root reference chart.">
  <title>Freya's Root Chart — (Unofficial) UAD Study Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Noto+Sans+Arabic:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --p:#6750a4;
      --pc:#e9ddff;
      --opc:#21005d;
      --s:#fffbfe;
      --sl:#f7f2fa;
      --sh:#ece6f0;
      --ink:#1c1b1f;
      --v:#49454f;
      --o:#79747e;
      --ov:#cac4d0;
      --r:18px;
    }

    * { box-sizing:border-box; }

    body {
      min-height:100dvh;
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(circle at 8% 0, #efe8ff 0, transparent 30%),
        radial-gradient(circle at 92% 8%, #f6eaff 0, transparent 34%),
        var(--s);
      font-family:"Space Grotesk","Noto Sans Arabic",sans-serif;
    }

    button,input,a { font:inherit; }
    button { cursor:pointer; }

    .material-symbols-rounded {
      font-family:"Material Symbols Rounded";
      font-size:24px;
      line-height:1;
      font-weight:normal;
      font-style:normal;
      white-space:nowrap;
      font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
    }

    .app { width:min(1280px,100%); margin:auto; padding:22px; }

    .top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      flex-wrap:wrap;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .brand-mark {
      display:grid;
      place-items:center;
      width:42px;
      height:42px;
      border-radius:14px;
      color:var(--opc);
      background:var(--pc);
      flex-shrink:0;
    }

    .top h1 { margin:0; font-size:clamp(1.5rem,3vw,2.2rem); letter-spacing:-.04em; }
    .top p { margin:5px 0 0; color:var(--v); font-size:.9rem; }

    .icon {
      display:grid;
      place-items:center;
      width:46px;
      height:46px;
      padding:0;
      border:0;
      border-radius:50%;
      color:var(--v);
      background:transparent;
    }

    .icon:hover { background:rgb(29 27 32 / .08); }

    .tools { display:flex; gap:10px; margin:24px 0 12px; flex-wrap:wrap; }

    .search {
      flex:1;
      min-width:260px;
      padding:13px 16px;
      border:1px solid var(--o);
      border-radius:14px;
      color:var(--ink);
      background:var(--s);
      font:inherit;
      box-shadow:inset 0 0 16px rgb(103 80 164 / .06);
    }

    .filter {
      padding:10px 15px;
      border:1px solid var(--ov);
      border-radius:999px;
      color:var(--ink);
      background:var(--sh);
      font:700 .82rem inherit;
    }

    .filter.active {
      border-color:var(--p);
      color:#fff;
      background:var(--p);
      box-shadow:0 0 20px rgb(103 80 164 / .22);
    }

    .count { color:var(--v); font-size:.83rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px; }

    .root {
      position:relative;
      overflow:hidden;
      border:1px solid var(--ov);
      border-radius:var(--r);
      background:linear-gradient(135deg,#fff,#f9f5ff);
      box-shadow:0 12px 28px rgb(31 27 48 / .09);
    }

    .root::before {
      position:absolute;
      top:-58px;
      right:-58px;
      width:120px;
      height:120px;
      border-radius:50%;
      background:rgb(196 181 253 / .28);
      content:"";
      filter:blur(4px);
      pointer-events:none;
    }

    .root summary {
      position:relative;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:18px;
      cursor:pointer;
      list-style:none;
    }

    .root summary::-webkit-details-marker { display:none; }
    .root[open] { border-color:var(--p); box-shadow:0 0 0 1px rgb(103 80 164 / .28),0 15px 30px rgb(31 27 48 / .12); }
    .root[open] summary { background:linear-gradient(90deg,rgb(233 221 255 / .85),transparent); }

    .root-name {
      color:var(--opc);
      font:700 1.3rem "Noto Sans Arabic",sans-serif;
      direction:rtl;
    }

    .badges { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
    .badge { padding:5px 8px; border-radius:999px; color:var(--v); background:var(--sl); font-size:.67rem; font-weight:800; }
    .content { position:relative; padding:0 18px 18px; }
    .section-title { margin:16px 0 7px; color:var(--p); font-size:.73rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }

    .thread {
      margin:0;
      padding:13px;
      border:1px solid var(--ov);
      border-radius:13px;
      color:var(--ink);
      background:var(--sl);
      font-size:.85rem;
      line-height:1.58;
      white-space:pre-wrap;
    }

    .measures { display:grid; gap:8px; }
    .measure { padding:11px; border:1px solid var(--ov); border-radius:13px; background:#fff; }
    .measure b { display:block; color:#146b63; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; }
    .measure p { margin:5px 0 0; font-size:.83rem; line-height:1.45; }
    .keys { display:flex; gap:7px; flex-wrap:wrap; }
    .key { padding:7px 10px; border:1px solid rgb(103 80 164 / .28); border-radius:999px; color:var(--opc); background:var(--pc); font:600 .8rem "Noto Sans Arabic",sans-serif; }
    .empty { grid-column:1/-1; padding:30px; color:var(--v); text-align:center; }

    .drawer-backdrop {
      position:fixed;
      inset:0;
      z-index:20;
      background:rgb(29 27 32 / .12);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
    }

    .drawer-backdrop.open { opacity:1; pointer-events:auto; }

    .drawer {
      position:fixed;
      top:0;
      right:0;
      bottom:0;
      z-index:21;
      display:flex;
      flex-direction:column;
      width:min(86vw,340px);
      padding:max(18px,env(safe-area-inset-top)) 16px 24px;
      background:var(--s);
      box-shadow:-8px 0 26px rgb(0 0 0 / .18);
      transform:translateX(105%);
      transition:transform .22s ease;
    }

    .drawer.open { transform:translateX(0); }
    .drawer-head { display:flex; align-items:center; justify-content:space-between; min-height:56px; margin-bottom:16px; }
    .drawer-head strong { font-size:1.1rem; }
    .drawer-links { display:grid; gap:8px; }

    .drawer-links a,
    .drawer-links button {
      display:flex;
      align-items:center;
      gap:14px;
      width:100%;
      min-height:54px;
      padding:0 14px;
      border:0;
      border-radius:16px;
      color:var(--ink);
      background:transparent;
      font-size:.95rem;
      font-weight:700;
      text-align:left;
      text-decoration:none;
    }

    .drawer-links a:hover,
    .drawer-links button:hover { background:var(--sl); }
    .drawer-links .material-symbols-rounded { color:var(--p); }
    .firebase-google-mark { display:grid; place-items:center; width:24px; height:24px; border-radius:50%; color:#4285f4; background:#fff; font-weight:800; }
    .firebase-auth-message { display:block; padding:8px 14px 0; color:var(--v); font-size:.78rem; }
    .firebase-menu-divider { height:1px; margin:12px 0; background:var(--ov); }

    @media (min-width:900px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (min-width:1180px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span class="material-symbols-rounded">account_tree</span></div>
        <div>
          <h1>Freya's Root Reference</h1>
          <p>All roots remain visible. Expand any card for the full semantic record.</p>
        </div>
      </div>
      <button class="icon" data-menu-button type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
        <span class="material-symbols-rounded" aria-hidden="true">menu</span>
      </button>
    </header>

    <div class="tools">
      <input id="search" class="search" aria-label="Search roots" placeholder="Search root, thread, measure, or keyword">
      <button class="filter active" data-f="all">All</button>
      <button class="filter" data-f="measures">Measures</button>
      <button class="filter" data-f="keywords">Keywords</button>
    </div>

    <p class="count" id="count">Loading roots…</p>
    <main class="grid" id="grid"></main>
  </div>

  <div data-hamburger-menu></div>

  <script>
    const grid=document.querySelector('#grid'),search=document.querySelector('#search'),count=document.querySelector('#count');
    let rows=[],f='all';
    const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    function csv(t){let a=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x==='"'&&q&&n==='"'){c+='"';i++}else if(x==='"')q=!q;else if(x===','&&!q){r.push(c);c=''}else if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c);if(r.some(v=>v.trim()))a.push(r);r=[];c=''}else c+=x}r.push(c);if(r.some(v=>v.trim()))a.push(r);let h=a.shift().map(x=>x.trim());return a.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))}
    function vals(r,p){return Object.entries(r).filter(([k,v])=>k.toLowerCase().startsWith(p)&&v&&v!=='X')}
    function ok(r){let s=search.value.toLowerCase();return(f==='all'||f==='measures'&&vals(r,'measure').length||f==='keywords'&&vals(r,'keyword').length)&&(!s||Object.values(r).join(' ').toLowerCase().includes(s))}
    function render(){let list=rows.filter(ok);count.textContent=list.length+' of '+rows.length+' roots shown';grid.innerHTML=list.length?list.map(r=>{let ms=vals(r,'measure'),ks=vals(r,'keyword');return'<details class="root"><summary><span class="root-name">'+esc(r.Roots)+'</span><span class="badges"><span class="badge">'+ms.length+' measures</span><span class="badge">'+ks.length+' keywords</span></span></summary><div class="content">'+(r.Thread?'<h2 class="section-title">Semantic thread</h2><p class="thread">'+esc(r.Thread)+'</p>':'')+(ms.length?'<h2 class="section-title">Measures</h2><div class="measures">'+ms.map(([k,v])=>'<div class="measure"><b>'+esc(k)+'</b><p>'+esc(v)+'</p></div>').join('')+'</div>':'')+(ks.length?'<h2 class="section-title">Keywords</h2><div class="keys">'+ks.map(([k,v])=>'<span class="key" title="'+esc(k)+'" dir="rtl">'+esc(v)+'</span>').join('')+'</div>':'')+'</div></details>'}).join(''):'<p class="empty">No roots match your search.</p>'}
    search.oninput=render;
    document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{f=b.dataset.f;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});
    fetch('data/freyas-roots.csv').then(r=>r.text()).then(t=>{rows=csv(t).filter(r=>r.Roots);render()}).catch(()=>count.textContent='Could not load the root chart CSV.');
  </script>
  <script src="hamburger-menu.js"></script>
  <script type="module" src="./firebase-auth.js"></script>
  <script>
    document.addEventListener('shared-menu:progress', () => {
      location.href = 'arabic.html#units';
    });
  </script>
</body>
</html>
