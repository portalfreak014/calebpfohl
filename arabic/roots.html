<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1630"><title>Freya's Root Constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#091027;--panel:#111b3a;--panel2:#172550;--line:#314270;--ink:#eff3ff;--muted:#aeb9d8;--aqua:#75e6da;--violet:#aa91ff;--gold:#ffd479;--pink:#ff8eb5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 10%,#243b75 0,#091027 42%),#091027;color:var(--ink);font-family:"Space Grotesk","Noto Sans Arabic",sans-serif;min-height:100dvh}.app{max-width:1440px;margin:auto;padding:20px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.back{color:var(--ink);text-decoration:none;background:#ffffff12;border:1px solid #ffffff22;border-radius:999px;padding:10px 15px}.title h1{margin:0;font-size:clamp(1.35rem,3vw,2.25rem)}.title p{margin:5px 0 0;color:var(--muted);font-size:.9rem}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 14px}.search{min-width:min(100%,330px);flex:1;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#0d1734;color:var(--ink);font:inherit}.toggle{border:1px solid var(--line);border-radius:999px;padding:10px 14px;color:var(--ink);background:#172550;cursor:pointer;font:inherit}.toggle.active{background:var(--violet);color:#18102f;border-color:var(--violet)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 365px;gap:16px}.sky{position:relative;min-height:620px;overflow:hidden;border:1px solid #ffffff18;border-radius:26px;background:radial-gradient(circle at 70% 20%,#263f86 0,#0e193b 36%,#080f24 75%)}.sky:before{content:"";position:absolute;inset:0;opacity:.35;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:48px 48px;pointer-events:none}.node{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;border:0;border-radius:50%;color:#11152d;background:var(--aqua);box-shadow:0 0 0 5px #75e6da20,0 0 28px #75e6da80;cursor:pointer;font:700 .82rem "Noto Sans Arabic",sans-serif;transition:transform .18s,filter .18s;z-index:1}.node:hover,.node.active{transform:translate(-50%,-50%) scale(1.18);filter:brightness(1.15)}.node[data-tint="1"]{background:var(--violet);box-shadow:0 0 0 5px #aa91ff20,0 0 28px #aa91ff80}.node[data-tint="2"]{background:var(--gold);box-shadow:0 0 0 5px #ffd47920,0 0 28px #ffd47980}.node[data-tint="3"]{background:var(--pink);box-shadow:0 0 0 5px #ff8eb520,0 0 28px #ff8eb580}.node span{padding:6px;text-align:center;line-height:1.1}.empty{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:var(--muted)}.panel{border:1px solid #ffffff18;border-radius:26px;background:#0e1835;padding:20px;max-height:760px;overflow:auto}.panel h2{margin:0 0 5px;font-size:1.2rem}.meta{margin:0 0 18px;color:var(--muted);font-size:.82rem}.thread{padding:13px;border-radius:16px;background:#172550;line-height:1.55;font-size:.89rem;white-space:pre-wrap}.measures{display:grid;gap:9px;margin-top:15px}.measure{border:1px solid var(--line);border-radius:14px;background:#111d40;padding:11px}.measure b{display:block;color:var(--aqua);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}.measure p{margin:0;font-size:.85rem;line-height:1.45}.keywords{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.keyword{padding:7px 10px;border-radius:999px;background:#ffffff12;color:var(--gold);font:600 .82rem "Noto Sans Arabic",sans-serif}.legend{position:absolute;bottom:14px;left:14px;color:var(--muted);font-size:.75rem;background:#091027c9;border:1px solid #ffffff18;border-radius:12px;padding:10px}.status{color:var(--muted);font-size:.82rem;margin:0 0 12px}@media(max-width:900px){.layout{grid-template-columns:1fr}.sky{min-height:500px}.panel{max-height:none}}@media(prefers-reduced-motion:reduce){.node{transition:none}}
</style>
</head>
<body><div class="app"><header class="top"><a class="back" href="arabic.html">Back to Arabic Study</a><div class="title"><h1>Freya's Root Constellation</h1><p>Explore semantic roots, measures, and keywords as a navigable sky.</p></div></header><div class="controls"><input id="search" class="search" placeholder="Search a root, thread, measure, or keyword" aria-label="Search roots"><button class="toggle active" data-filter="all">All roots</button><button class="toggle" data-filter="measures">Has measures</button><button class="toggle" data-filter="keywords">Has keywords</button></div><p class="status" id="status">Loading root chart…</p><main class="layout"><section class="sky" id="sky" aria-label="Root constellation"><div class="legend">Node size = populated measures + keywords. Select a node to inspect it.</div></section><aside class="panel" id="panel"><h2>Select a root</h2><p class="meta">Its thread, measures, and keywords will appear here.</p></aside></main></div>
<script>
const sky=document.getElementById('sky'),panel=document.getElementById('panel'),status=document.getElementById('status'),search=document.getElementById('search');let rows=[],filter='all',selected=null;
function parseCSV(t){const out=[];let row=[],cell='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"'){q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))out.push(row);const h=out.shift().map(x=>x.trim());return out.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))}
function fields(row,prefix){return Object.entries(row).filter(([k,v])=>k.toLowerCase().startsWith(prefix)&&v&&v!=='X').map(([k,v])=>({k,v}))}
function score(r){return fields(r,'measure').length+fields(r,'keyword').length}
function matches(r){const s=search.value.toLowerCase().trim();if(filter==='measures'&&!fields(r,'measure').length)return false;if(filter==='keywords'&&!fields(r,'keyword').length)return false;return !s||Object.values(r).join(' ').toLowerCase().includes(s)}
function render(){const visible=rows.filter(matches);sky.querySelectorAll('.node,.empty').forEach(n=>n.remove());status.textContent=visible.length+' of '+rows.length+' roots visible';if(!visible.length){sky.insertAdjacentHTML('afterbegin','<div class="empty">No roots match that search.</div>');return}visible.forEach((r,i)=>{const n=document.createElement('button'),size=42+Math.min(score(r),15)*4,angle=i*2.3999632297,rad=15+Math.sqrt(i)*8;let x=50+Math.cos(angle)*rad,y=50+Math.sin(angle)*rad;x=Math.max(7,Math.min(93,x));y=Math.max(8,Math.min(90,y));n.className='node'+(selected===r?' active':'');n.style.cssText=`left:${x}%;top:${y}%;width:${size}px;height:${size}px`;n.dataset.tint=i%4;n.innerHTML='<span dir="rtl">'+escape(r.Roots||'—')+'</span>';n.title=(r.Roots||'Root')+' — '+score(r)+' data points';n.onclick=()=>{selected=r;render();detail(r)};sky.appendChild(n)});if(selected&&!visible.includes(selected)){selected=null;panel.innerHTML='<h2>Select a root</h2><p class="meta">Its thread, measures, and keywords will appear here.</p>'}}
function escape(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function detail(r){const ms=fields(r,'measure'),ks=fields(r,'keyword');panel.innerHTML='<h2 dir="rtl">'+escape(r.Roots||'Unnamed root')+'</h2><p class="meta">'+ms.length+' populated measures · '+ks.length+' keywords</p>'+(r.Thread?'<div class="thread">'+escape(r.Thread)+'</div>':'<p class="meta">No thread provided.</p>')+'<div class="measures">'+ms.map(x=>'<article class="measure"><b>'+escape(x.k)+'</b><p>'+escape(x.v)+'</p></article>').join('')+'</div>'+(ks.length?'<div class="keywords">'+ks.map(x=>'<span class="keyword" dir="rtl" title="'+escape(x.k)+'">'+escape(x.v)+'</span>').join('')+'</div>':'')}
function refresh(){render()}search.addEventListener('input',refresh);document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.toggle').forEach(x=>x.classList.toggle('active',x===b));render()});
fetch('data/freyas-roots.csv').then(r=>{if(!r.ok)throw Error('The root chart CSV could not be loaded.');return r.text()}).then(t=>{rows=parseCSV(t).filter(r=>r.Roots);status.textContent='Loaded '+rows.length+' roots.';render()}).catch(e=>{status.textContent=e.message;sky.insertAdjacentHTML('afterbegin','<div class="empty">Upload the CSV as <code>arabic/data/freyas-roots.csv</code> and refresh.</div>')});
</script></body></html>
