[build]
  command = "node scripts/prepare-arabic.mjs"

[[redirects]]
  from = "/areastudies"
  to = "/areastudies.html"
  status = 200

[[redirects]]
  from = "/arabic"
  to = "/arabic/arabic"
  status = 301

[[headers]]
  for = "/arabic/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
